name: Build Postia image

# Builds the Postia (rebranded Postiz) container from this fork with the same
# Dockerfile upstream uses for ghcr.io/gitroomhq/postiz-app, and publishes it to
# ghcr.io/<owner>/postiame. The build runs here, not on the VPS.
#
# Going live is a separate, explicit step: set the `sha-<commit>` tag this
# workflow prints as the postiz image in deploy/hostinger/docker-compose.yml
# and push; deploy-postia.yml then rolls it out.
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'libraries/**'
      - 'Dockerfile.dev'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'var/docker/**'
      - '.github/workflows/build-postia-image.yml'
  workflow_dispatch:

concurrency:
  group: build-postia-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/postiame"
          short="${GITHUB_SHA::7}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$short" >> "$GITHUB_OUTPUT"
          echo "version=postia-$short" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Published ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "To go live, set this as the postiz image in deploy/hostinger/docker-compose.yml." >> "$GITHUB_STEP_SUMMARY"
