name: Deploy to postia.me

# Every push to main that touches deploy/hostinger/** goes live on the
# Hostinger VPS. The SSH key is restricted (forced command) to
# /usr/local/bin/postia-deploy: git reset --hard origin/main + docker compose up -d.
on:
  push:
    branches: [main]
    paths:
      - 'deploy/hostinger/**'
      - '.github/workflows/deploy-postia.yml'
  workflow_dispatch:

concurrency:
  group: deploy-postia
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o ServerAliveInterval=30 root@31.220.17.97 deploy
