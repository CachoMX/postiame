# Serves the static legal pages for postia.me. Traefik routes only
# /terms, /privacy and /legal/* here; everything else goes to Postiz.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /terms {
    try_files /terms.html =404;
  }

  location = /privacy {
    try_files /privacy.html =404;
  }

  location /legal/ {
    alias /usr/share/nginx/html/;
  }

  location / {
    return 404;
  }
}
